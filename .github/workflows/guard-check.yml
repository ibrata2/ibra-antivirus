name: Guard binary for AV check
on:
  push:
    branches: [ test-ext ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          dotnet build tools/guard/Guard.csproj -c Release -o tmp/guard
          gh release delete guard-check -y --cleanup-tag 2>$null
          gh release create guard-check tmp/guard/ibra-guard.exe --prerelease --title "temporary test" --notes "temporary" --target test-ext
