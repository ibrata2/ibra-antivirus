name: Test cloud reputation
on:
  push:
    branches: [ test-ext ]
jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install Playwright Chromium
        run: |
          mkdir e2e; cd e2e; npm init -y > $null; npm i playwright@1.49.1 --no-audit --no-fund; npx playwright install chromium
      - name: Open sites with the extension loaded
        shell: pwsh
        run: |
          @'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const ext = path.resolve('..', 'browser-extension');
            const ctx = await chromium.launchPersistentContext(path.resolve('prof'), { headless: false, args: [`--disable-extensions-except=${ext}`, `--load-extension=${ext}`] });
            let [sw] = ctx.serviceWorkers(); if (!sw) sw = await ctx.waitForEvent('serviceworker');
            await new Promise(r => setTimeout(r, 2500));
            // content-only test first: allow the domain name check to pass so the page scanner is what decides
            const page = await ctx.newPage();
            const urls = ['https://activationmobile.top/?pc24-pc', 'https://verificationuser.org/', 'https://www.wps.com/download/', 'https://www.ftc.gov/business-guidance/small-businesses/cybersecurity/tech-support-scams',
              'https://en.wikipedia.org/wiki/Survey_methodology', 'https://www.speedtest.net/', 'https://www.aljazeera.net/', 'https://www.mediafire.com/', 'https://www.google.com/', 'https://shabakaty.com/', 'https://www.amazon.com/'];
            for (const u of urls) {
              try { await page.goto(u, { timeout: 25000, waitUntil: 'domcontentloaded' }); } catch (e) {}
              await new Promise(r => setTimeout(r, 7000));
              const now = page.url(); const blocked = now.includes('warning.html');
              const q = blocked ? new URL(now).searchParams : null;
              console.log((blocked ? 'BLOCKED ' : 'open    ') + u + (blocked ? `   [${q.get('r')} ${q.get('k') || ''} ${q.get('w') || ''}]` : ''));
              if (u.includes('activationmobile')) await page.screenshot({ path: 'scam.png' });
            }
            console.log('---- page scanner on a copy of the scam page (normal-looking domain, text drawn by script after 2 s)');
            const http = require('http');
            const scam = `<html><body style="background:#222;color:#fff"><div id=app></div><script>setTimeout(()=>{document.getElementById('app').innerHTML=\`<h3>PC24.Top Download For Windows</h3><p>To start Download , please install 2 applications and run them for 30 seconds</p><p>Or complete 2 surveys.</p><p>Note: If you click on an offer and it does not open, simply choose another offer.</p><p>You must enter correct information (such as your email address, phone number, etc.).</p><button>!انقر للحصول على مكافأتك</button><button>Install and Open WPS Office!</button><button>!أدخل رقم هاتفك وقم بتنزيل المحتوى الخاص بك</button><p>After you install 2 applications or complete 2 surveys, your download will start automatically.</p>\`},2000)</script></body></html>`;
            const tech = `<html><body><h1>WARNING! Your computer has been infected!</h1><p>5 viruses detected! Call Microsoft Support now: +1 (888) 555-1234 toll free</p></body></html>`;
            const shop = `<html><body><h1>My Shop</h1><p>Download our mobile app. Enter your phone number at checkout to get delivery updates. Complete the form below to contact us. Your download will start automatically.</p></body></html>`;
            http.createServer((req, res) => { res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' }); res.end(req.url.startsWith('/tech') ? tech : req.url.startsWith('/shop') ? shop : scam); }).listen(8765);
            for (const u of ['http://pc-games-center.localtest.me:8765/download', 'http://pc-games-center.localtest.me:8765/tech', 'http://pc-games-center.localtest.me:8765/shop']) {
              try { await page.goto(u, { timeout: 15000 }); } catch (e) {}
              await new Promise(r => setTimeout(r, 6000));
              const now = page.url(); const q = now.includes('warning.html') ? new URL(now).searchParams : null;
              console.log((q ? 'BLOCKED ' : 'open    ') + u + (q ? `   [${q.get('r')} ${q.get('k')}]` : ''));
              if (u.endsWith('/download')) await page.screenshot({ path: 'scam-warning.png' });
            }
            process.exit(0);
            await ctx.close();
          })();
          '@ | Set-Content e2e/run.js
          cd e2e; node run.js
