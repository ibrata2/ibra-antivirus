name: Test cloud reputation
on:
  push:
    branches: [ test-ext ]
jobs:
  dns:
    runs-on: windows-latest
    steps:
      - name: Verdicts for activationmobile.top
        shell: pwsh
        run: |
          foreach ($d in 'activationmobile.top','pc24.top') {
            foreach ($r in 'https://security.cloudflare-dns.com/dns-query','https://dns.adguard-dns.com/resolve','https://cloudflare-dns.com/dns-query') {
              try { $x = Invoke-RestMethod -Uri "$r`?name=$d&type=A" -Headers @{accept='application/dns-json'} -TimeoutSec 10; "$d $r -> $($x.Status) $(($x.Answer|?{$_.type -eq 1}|select -First 1).data)" } catch { "$d $r ERR" } } }
          foreach ($u in 'https://openphish.com/feed.txt','https://phishing.army/download/phishing_army_blocklist.txt','https://urlhaus.abuse.ch/downloads/hostfile/','https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt','https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/fake-onlydomains.txt') {
            try { $c = (Invoke-WebRequest $u -UseBasicParsing).Content; "$u -> $([bool]($c -match 'activationmobile'))" } catch { "$u ERR" } }
          try { $p = Invoke-WebRequest 'https://activationmobile.top/?pc24-pc' -UseBasicParsing -TimeoutSec 20; "PAGE status $($p.StatusCode) len $($p.Content.Length)"; ($p.Content -replace '\s+',' ').Substring(0, [Math]::Min(3000, $p.Content.Length)) } catch { "PAGE ERR $_" }
