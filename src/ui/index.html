<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>IBRA ANTIVIRUS</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg"></div>

<!-- Title bar: fixed in every language -->
<header class="titlebar">
  <div class="tb-brand"><img src="../../assets/icon.png" alt=""><b>IBRA</b><span>ANTIVIRUS</span></div>
  <div class="tb-drag"></div>
  <div class="tb-btns">
    <button class="tb-btn" data-win="min" title="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button class="tb-btn" data-win="max" title="Maximize"><svg viewBox="0 0 12 12" id="maxIcon"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
    <button class="tb-btn close" data-win="close" title="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
  </div>
</header>

<div class="layout">
  <!-- Sidebar: fixed on the left in every language -->
  <nav class="side">
    <button class="nav active" data-page="home"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/></svg><span class="tx" data-t="navHome"></span></button>
    <button class="nav" data-page="scan"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="tx" data-t="navScan"></span><i class="badge" id="qBadge"></i></button>
    <button class="nav" data-page="protect"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0116 0"/><path d="M12 12l4-4"/><circle cx="12" cy="12" r="1.5"/><path d="M4 17h16"/></svg><span class="tx" data-t="navProtect"></span></button>
    <button class="nav" data-page="browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="tx" data-t="navBrowser"></span></button>
    <button class="nav" data-page="links"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg><span class="tx" data-t="navLinks"></span></button>
    <button class="nav" data-page="firewall"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M3 15h18M9 5v5M15 10v5M9 15v4"/></svg><span class="tx" data-t="navFirewall"></span><i class="badge" id="fwBadge"></i></button>
    <button class="nav" data-page="quarantine"><svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M8 9V6a4 4 0 018 0v3"/></svg><span class="tx" data-t="navQuarantine"></span></button>
    <button class="nav" data-page="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span class="tx" data-t="navHistory"></span></button>
    <button class="nav" data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span class="tx" data-t="navSettings"></span></button>
    <div class="side-fill"></div>
    <button class="nav" data-page="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="tx" data-t="navAbout"></span></button>
    <div class="lang-switch">
      <button data-lang="ar">عربي</button><button data-lang="en">EN</button>
    </div>
  </nav>

  <main class="content">

    <!-- HOME -->
    <section class="page active" id="page-home">
      <div class="hero glass">
        <div class="shield-wrap"><img id="heroShield" class="shield" src="../../assets/shield-green.png" alt=""></div>
        <div class="hero-text">
          <h1 class="tx" id="heroTitle"></h1>
          <p class="tx muted" id="heroSub"></p>
          <div class="hero-actions">
            <button class="btn primary big" id="btnQuick"><span class="tx" data-t="quickScan"></span></button>
            <button class="btn primary red big" id="btnFixAll" hidden><span class="tx" data-t="fixAll"></span></button>
          </div>
          <p class="tx small muted" id="lastScan"></p>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>

    <!-- SCAN -->
    <section class="page" id="page-scan">
      <div id="scanChooser">
        <h2 class="tx" data-t="chooseScan"></h2>
        <div class="scan-types">
          <button class="scan-card glass" data-scan="quick">
            <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
            <b class="tx" data-t="quickScan"></b><span class="tx muted" data-t="quickDesc"></span>
          </button>
          <button class="scan-card glass" data-scan="full">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            <b class="tx" data-t="fullScan"></b><span class="tx muted" data-t="fullDesc"></span>
          </button>
          <button class="scan-card glass" data-scan="folder">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            <b class="tx" data-t="folderScan"></b><span class="tx muted" data-t="folderDesc"></span>
          </button>
          <button class="scan-card glass" data-scan="file">
            <svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z"/><path d="M14 2v5h5"/></svg>
            <b class="tx" data-t="fileScan"></b><span class="tx muted" data-t="fileDesc"></span>
          </button>
        </div>
        <div class="drop glass" id="drop"><span class="tx" data-t="dropHere"></span></div>
      </div>

      <div id="scanRunning" hidden>
        <div class="run glass">
          <img id="runShield" class="shield pulse" src="../../assets/shield-orange.png" alt="">
          <div class="run-info">
            <div class="run-head"><h2 class="tx" id="runTitle"></h2><b id="runPct">0%</b></div>
            <div class="bar"><i id="runBar"></i></div>
            <p class="tx muted" id="runPhase"></p>
            <p class="path" id="runFile"></p>
            <div class="run-stats">
              <div><b id="runFiles">0</b><span class="tx" data-t="files"></span></div>
              <div class="danger-txt"><b id="runFound">0</b><span class="tx" data-t="threats"></span></div>
              <div><b id="runTime">00:00</b><span class="tx" data-t="elapsed"></span></div>
            </div>
            <button class="btn ghost" id="btnCancel"><span class="tx" data-t="cancel"></span></button>
          </div>
        </div>
        <div class="live-list" id="liveThreats"></div>
      </div>

      <div id="scanResult" hidden>
        <div class="result-head glass">
          <img id="resShield" class="shield sm" src="../../assets/shield-green.png" alt="">
          <div><h2 class="tx" id="resTitle"></h2><p class="tx muted" id="resSub"></p></div>
          <div class="grow"></div>
          <button class="btn primary" id="btnResAll" hidden><span class="tx" data-t="quarantineAll"></span></button>
          <button class="btn ghost" id="btnResBack"><span class="tx" data-t="newScan"></span></button>
        </div>
        <div class="threat-list" id="resList"></div>
      </div>
    </section>

    <!-- PROTECTION -->
    <section class="page" id="page-protect">
      <h2 class="tx" data-t="navProtect"></h2>
      <div class="rows" id="protectRows"></div>
    </section>

    <!-- BROWSER PROTECTION -->
    <section class="page" id="page-browser">
      <div class="hero glass sm-hero">
        <img id="brShield" class="shield sm" src="../../assets/shield-green.png" alt="">
        <div class="hero-text"><h2 class="tx" id="brTitle"></h2><p class="tx muted" id="brSub"></p></div>
        <div class="stat-pills"><div><b id="brBlocked">0</b><span class="tx" data-t="brBlockedL"></span></div></div>
      </div>
      <h3 class="tx" data-t="brInstallT"></h3>
      <p class="tx muted small" data-t="brInstallD"></p>
      <div class="ex-btns"><button class="btn primary" id="brAutoAll"><span class="tx" data-t="brAutoAll"></span></button>
        <button class="btn ghost" id="brManual"><span class="tx" data-t="brManual"></span></button>
        <button class="btn ghost" id="brLogBtn"><span class="tx" data-t="brLogFile"></span></button></div>
      <div class="browser-grid" id="brList"></div>
      <div class="steps glass" id="brSteps" hidden>
        <b class="tx" data-t="brStepsT"></b>
        <ol>
          <li class="tx" data-t="brStep1"></li>
          <li class="tx" data-t="brStep2"></li>
          <li class="tx" data-t="brStep3"></li>
          <li class="tx" data-t="brStep4"></li>
        </ol>
        <div class="path" id="brDir"></div>
        <div class="ex-btns"><button class="btn ghost sm" id="brOpenDir"><span class="tx" data-t="brOpenDir"></span></button></div>
      </div>
      <h3 class="tx" data-t="brFeaturesT"></h3>
      <div class="rows" id="brFeatures"></div>
      <div class="page-head" style="margin-top:22px"><h3 class="tx" data-t="brLogT" style="margin:0"></h3><div class="grow"></div><button class="btn ghost sm" id="brLogClear"><span class="tx" data-t="clearHistory"></span></button></div>
      <div class="threat-list" id="brLog"></div>
    </section>

    <!-- LINK CHECKER -->
    <section class="page" id="page-links">
      <div class="hero glass sm-hero">
        <img class="shield sm" src="../../assets/shield-green.png" alt="">
        <div class="hero-text"><h2 class="tx" data-t="lkTitle"></h2><p class="tx muted" data-t="lkSub"></p></div>
      </div>
      <div class="lk-box glass">
        <input id="lkInput" class="lk-input" dir="auto" autocomplete="off" spellcheck="false">
        <button class="btn ghost" id="lkPaste"><span class="tx" data-t="lkPaste"></span></button>
        <button class="btn primary" id="lkGo"><span class="tx" data-t="lkCheck"></span></button>
      </div>
      <div id="lkResult"></div>
      <div class="rows" id="lkRows" style="margin-top:14px"></div>
      <div class="page-head" style="margin-top:22px"><h3 class="tx" data-t="lkHist" style="margin:0"></h3><div class="grow"></div><button class="btn ghost sm" id="lkClear"><span class="tx" data-t="clearHistory"></span></button></div>
      <div class="threat-list" id="lkList"></div>
    </section>

    <!-- FIREWALL -->
    <section class="page" id="page-firewall">
      <div class="hero glass sm-hero">
        <img id="fwShield" class="shield sm" src="../../assets/shield-green.png" alt="">
        <div class="hero-text"><h2 class="tx" id="fwTitle"></h2><p class="tx muted" id="fwSub"></p></div>
        <button class="btn primary" id="fwEnable" hidden><span class="tx" data-t="fwEnable"></span></button>
      </div>
      <div class="rows" id="fwRows"></div>
      <div class="page-head" style="margin-top:20px"><h3 class="tx" data-t="fwLiveT" style="margin:0"></h3><div class="grow"></div>
        <button class="btn ghost sm" id="fwRefresh"><span class="tx" data-t="refresh"></span></button>
        <button class="btn ghost sm" id="fwPick"><span class="tx" data-t="fwPick"></span></button></div>
      <p class="tx muted small" data-t="fwLiveD"></p>
      <div class="threat-list" id="fwLive"></div>
      <h3 class="tx" data-t="fwBlockedT"></h3>
      <div class="threat-list" id="fwBlocked"></div>
    </section>

    <!-- QUARANTINE -->
    <section class="page" id="page-quarantine">
      <div class="page-head"><h2 class="tx" data-t="navQuarantine"></h2><div class="grow"></div><button class="btn ghost" id="btnQClear"><span class="tx" data-t="deleteAll"></span></button></div>
      <p class="tx muted" data-t="qDesc"></p>
      <div class="threat-list" id="qList"></div>
    </section>

    <!-- HISTORY -->
    <section class="page" id="page-history">
      <div class="page-head"><h2 class="tx" data-t="navHistory"></h2><div class="grow"></div><button class="btn ghost" id="btnHClear"><span class="tx" data-t="clearHistory"></span></button></div>
      <div class="threat-list" id="hList"></div>
    </section>

    <!-- SETTINGS -->
    <section class="page" id="page-settings">
      <h2 class="tx" data-t="navSettings"></h2>
      <div class="rows" id="settingsRows"></div>
      <h3 class="tx" data-t="exclusions"></h3>
      <p class="tx muted small" data-t="exclusionsDesc"></p>
      <div class="ex-btns"><button class="btn ghost" id="exFolder"><span class="tx" data-t="addFolder"></span></button><button class="btn ghost" id="exFile"><span class="tx" data-t="addFile"></span></button></div>
      <div class="threat-list" id="exList"></div>
    </section>

    <!-- ABOUT -->
    <section class="page" id="page-about">
      <div class="about glass">
        <img src="../../assets/shield-green.png" class="shield" alt="">
        <h1>IBRA ANTIVIRUS</h1>
        <p class="muted" id="aboutVer"></p>
        <p class="tx credit">برمجة وتطوير ابراهيم الخزرجي</p>
        <div class="links">
          <button class="link" data-url="https://ibraprogram.netlify.app/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="tx" data-t="mySite"></span></button>
          <button class="link" data-url="https://t.me/ibraprogram"><svg viewBox="0 0 24 24"><path d="M21 4L3 11l6 2 2 6 3-4 5 4z"/></svg><span>Telegram</span></button>
          <button class="link" data-url="https://www.tiktok.com/@ibraprogram"><svg viewBox="0 0 24 24"><path d="M14 3v11a3.5 3.5 0 11-3-3.4M14 3c.5 3 2.5 4.5 5 4.5"/></svg><span>TikTok</span></button>
          <button class="link" data-url="https://www.instagram.com/ibraprogram"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r=".8"/></svg><span>Instagram</span></button>
        </div>
        <p class="handle">@ibraprogram</p>
        <p class="tx small muted" data-t="enginesCredit"></p>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
